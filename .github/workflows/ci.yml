name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Git version
        run: git --version
      - name: Restore locked dependencies
        run: dotnet restore GitGui.sln --locked-mode
      - name: Build
        run: dotnet build GitGui.sln -c Release --no-restore
      - name: Prepare verified PortableGit for Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/PreparePortableGit.ps1
      - name: Test
        run: dotnet test GitGui.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Windows AskPass apphost protocol
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/WindowsSmoke.ps1 -AppPath ./src/GitGui.App/bin/Release/net8.0/GitGui.App.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
